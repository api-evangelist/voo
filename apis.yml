name: VOO (now SideUp)
description: VOO was an Egyptian logistics marketplace that rebranded as SideUp in
  December 2022, relocating its headquarters to Riyadh, Saudi Arabia. SideUp is a
  fully integrated courier marketplace that lets e-commerce businesses ship locally
  and globally from one dashboard, connecting merchants with multiple courier services
  alongside payment gateways, shipping API integration, warehousing, and fulfillment,
  with plugins for Shopify, Salla, and OpenCart. Backed by 500 Global, Launch Africa
  VC, Riyadh Angels, and Alex Angels ($1.2M seed). No public developer portal or
  API documentation is published as of July 2026.
